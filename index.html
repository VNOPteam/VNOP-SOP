       "Examples",
       "Collection Method"

      "rows": [

        "Agent WITHOUT Portal",
        "Other agents (no portal)",
        "VNOP sends invoice reminder → Agent reviews and transfers funds by deadline"

     {
      "t": "h",
      "text": "Case A: Agent WITH Portal (e.g. Agoda, Ctrip, Meituan)"

     {
      "t": "list",
      "ordered": false,
      "items": [
       "Log in to the agent's payment portal.",
       "Locate the invoice or outstanding balance for the current payment period.",

       "Funds will be received within 3–5 business days.",
       "Confirm receipt in ELLIS once payment is reflected."

     {
      "t": "callout",
      "v": "tip",
      "title": "Portal Collection — Key Points",
      "lines": [

       "Do not wait for the agent to initiate payment — VNOP must trigger collection via the portal."
      ]
     },
     {
      "t": "h",
      "text": "Case B: Agent WITHOUT Portal"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "When the invoice period is due, send an invoice reminder email to the agent.",
       "Include the invoice from ELLIS in the reminder (exported as PDF or Excel).",
       "Request the agent to review and transfer the payment by the agreed deadline."

     },
     {
      "t": "para",
      "text": "Agent's response:"

      "t": "list",
      "ordered": false,
      "items": [

      "t": "h",
      "text": "Step 3 – Export Invoice from ELLIS & Reconcile"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "Export the invoice from ELLIS as an Excel file for the relevant payment period.",
       "Obtain the agent's remittance advice (payment breakdown sent by the agent).",
       "Compare the ELLIS invoice line by line against the agent's remittance:",
       "Match each booking reference and amount in both documents.",
       "Identify any bookings where the amount differs or is missing from the remittance.",
       "Categorize discrepancies:",
       "Booking fully unpaid (present in ELLIS invoice but absent from agent remittance).",
       "Booking partially paid (amount in remittance is less than the ELLIS invoice amount).",
       "Booking disputed by agent (agent claims the amount is incorrect).",
       "Document all discrepancies found with booking references and amounts."
      ]
     },
     {
      "t": "h",
      "text": "Step 4 – Handle Discrepancies & Initiate Dispute"
     },
     {
      "t": "para",
      "text": "For any booking that is unpaid or underpaid compared to the ELLIS system amount, VNOP must initiate a dispute with the agent."
     },
     {
      "t": "table",
      "head": [
       "Dispute Scenario",
       "VNOP Action"
      ],
      "rows": [
       [
        "Booking not paid at all",
        "Contact AGT and request immediate payment. Provide invoice and booking details as evidence."
       ],
       [
        "Booking paid with insufficient amount",
        "Identify the shortfall. Contact AGT to request payment of the remaining balance."
       ],
       [
        "AGT disputes a booking amount",
        "Export invoice from ELLIS → Compare with AGT remittance line by line → Confirm or correct as needed."
       ],
       [
        "AGT requests check & confirmation",
        "Export ELLIS invoice as Excel → Investigate the specific booking discrepancy → Respond to AGT with findings."
       ]
      ]
     },
     {
      "t": "callout",
      "v": "warn",
      "title": "Dispute Process — Key Rules",
      "lines": [
       "Always use the ELLIS Excel export as the official source of truth when disputing amounts with the agent.",
       "Provide specific booking references and amounts when raising a dispute — do not send generic complaints.",
       "Follow up on all open disputes regularly until they are fully resolved and payment is confirmed.",
       "Document all dispute communications and outcomes in the ELLIS booking system."
      ]
     },
     {
      "t": "h",
      "text": "Step 5 – Monitor & Close"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "After disputes are raised, follow up with the agent at regular intervals until all outstanding amounts are paid.",
       "Once payment is received and confirmed, update the booking status in ELLIS accordingly.",
       "If the agent continues to dispute and no resolution is reached, escalate to the supervisor.",
       "Record the final outcome (paid / partially paid / unresolved) in the system for the monthly reconciliation report."
      ]
     },
     {
      "t": "h",
      "text": "Notes"
     },
     {
      "t": "callout",
      "v": "note",
      "title": "",
      "lines": [
       "Each channel has a different payment method and payment period — always check the channel configuration before sending reminders or collecting.",
       "ELLIS automatically sends invoices to agents based on the payment period — VNOP does not need to send the initial invoice manually, only reminders when payment is overdue.",

       "Identify discrepancies at the individual booking level — never dispute at the total amount level without specifying which bookings are affected.",
       "All dispute communications (emails, confirmations, and outcomes) must be logged in the ELLIS booking system.",
       "Unresolved disputes after multiple follow-ups must be escalated to the supervisor for further action."
      ]
     }
    ]

   "title": {

    "vi": "Quy trách nhiệm phụ phí do lỗi mapping và truy thu khi thuộc trách nhiệm agent.",

   },
   "purpose": {

    "en": "To ensure all extra charges resulting from a mapping error are correctly identified, attributed to the responsible party, and recovered where applicable. This SOP covers the post-mapping-check process: determining fault, updating the Loss Report (if OMH's fault), or initiating and following up on charge recovery from the agent (if agent's fault)."

   "body": {
    "en": [
     {
      "t": "h",
      "text": "Scope"
     },
     {
      "t": "para",
      "text": "This procedure applies to all mapping error cases where an extra charge has been incurred by OhMyHotel, following the initial mapping error identification and handling described in SOP-010."
     },
     {
      "t": "h",
      "text": "Responsibilities"
     },
     {
      "t": "kv",
      "title": "",
      "rows": [
       [
        "Front Desk / Booking Team (VNOP)",
        "Check for extra charges, identify fault party, update Loss Report or initiate charge recovery, collect evidence, and follow up until resolution."
       ],
       [
        "Content Team",
        "Investigate and confirm the source of the mapping error (OMH side or agent/partner side) and provide supporting documentation."
       ],
       [
        "Agent (AGT)",
        "Acknowledge the mapping error, provide confirmation email from their relevant team, and pay the extra charge if the fault is on their side."
       ],
       [
        "Finance / Related Team",
        "Process Loss Report updates and received payments."
       ]
      ]
     },
     {
      "t": "h",
      "text": "4. Procedure"
     },
     {
      "t": "h",
      "text": "Step 1 – Initial Actions When Mapping Issue Occurs"
     },
     {
      "t": "para",
      "text": "When a mapping error is identified, the following immediate actions must be taken in parallel (refer to SOP-010 for full mapping handling):"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "Notify the Agent of the mapping error.",
       "Coordinate with the hotel to handle the current guest's situation.",
       "Coordinate with the Content Team to investigate and fix the incorrect mapping.",
       "Then proceed to Step 2 to check for extra charges."
      ]
     },
     {
      "t": "h",
      "text": "Step 2 – Check for Extra Charge"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "After the mapping issue is identified, determine whether an extra charge has been incurred."
      ]
     },
     {
      "t": "h",
      "text": "Case A: No Extra Charge"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "If there is no financial difference between what was booked and what was actually provided — no extra charge applies.",
       "Wait for the Content Team or Agent to confirm that the mapping issue has been fixed.",
       "Once fix is confirmed → Close the case. ✔ Done."
      ]
     },
     {
      "t": "h",
      "text": "Case B: Extra Charge Exists"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "An extra charge exists when OMH paid more to the hotel than what was in the original booking (due to the mapping discrepancy).",

     },
     {
      "t": "callout",
      "v": "tip",
      "title": "What counts as an Extra Charge?",
      "lines": [

       "This amount is confirmed by the ELLIS invoice / payment record showing what OMH actually paid to the hotel."

     },
     {
      "t": "h",
      "text": "Step 3 – Determine Fault Party"
     },
     {
      "t": "para",
      "text": "Identify which side is responsible for the mapping error — this determines whether OMH absorbs the loss or recovers it from the agent."
     },
     {
      "t": "table",
      "head": [
       "Fault Party",
       "Extra Charge Responsibility",
       "VNOP Action"

      "rows": [
       [
        "OhMyHotel (OMH) Side",
        "OMH bears the full extra charge",
        "Update Loss Report with full booking history. No charge to agent."
       ],
       [
        "Agent / Sub-Agent Side",
        "Agent is responsible for the extra charge",
        "VNOP initiates charge recovery process from the agent. See Step 4."
       ]
      ]
     },
     {
      "t": "h",
      "text": "Case A: Mapping Error from OMH Side"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "OMH is responsible for the extra charge — the loss cannot be passed to the agent.",
       "Update the Loss Report with the following details:",
       "Booking reference number",
       "Hotel name and check-in date",
       "Room type booked vs. room type actually provided",
       "Extra charge amount",
       "Full booking history and supporting documents",
       "Close the recovery case. The Loss Report serves as the internal record. ✔"
      ]
     },
     {
      "t": "h",
      "text": "Case B: Mapping Error from Agent / Sub-Agent Side"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "The agent is responsible — VNOP initiates the charge recovery process.",
       "Proceed to Step 4."
      ]
     },
     {
      "t": "h",
      "text": "Step 4 – Collect Evidence for Recovery"
     },
     {
      "t": "para",
      "text": "Before contacting the agent for payment, gather all required supporting documents. Having strong evidence significantly increases the chance of successful recovery."
     },
     {
      "t": "table",
      "head": [
       "#",
       "Evidence / Document",
       "Purpose & Notes"
      ],
      "rows": [
       [
        "1",
        "Guest Voucher",
        "Shows the room type / rate the guest booked. Proves the discrepancy between what was booked and what was received — key evidence to confirm the mapping error."
       ],
       [
        "2",
        "ELLIS Invoice / Payment Record",
        "Shows the extra charge amount that OMH actually paid to the hotel. This is the financial proof of the loss incurred due to the mapping error."
       ],
       [
        "3",
        "Mapping Error Confirmation Email",
        "Email from the agent's relevant team (technical / mapping team / partner) confirming that a mapping error exists on their side. This is the most critical document for recovery."
       ],
       [
        "4",
        "Booking History & Comparison",
        "Booking details from ELLIS showing the room type booked vs. room type received. Demonstrates the difference that caused the extra charge."
       ]
      ]
     },
     {
      "t": "callout",
      "v": "warn",
      "title": "Most Critical Document",
      "lines": [
       "The Mapping Error Confirmation Email from the agent's relevant team (technical/mapping/partner team) is the single most important piece of evidence.",
       "Without this email, it is very difficult to enforce payment from the agent.",
       "Always request this email before proceeding to the payment recovery step."
      ]
     },
     {
      "t": "h",
      "text": "Step 5 – Send Recovery Request to Agent"
     },
     {
      "t": "list",
      "ordered": false,
      "items": [
       "Prepare a formal recovery request email to the agent including:",
       "A clear explanation of the mapping error and how it occurred.",
       "The extra charge amount OMH incurred and the calculation breakdown.",
       "Attach all supporting evidence: guest voucher, ELLIS invoice, booking history, mapping error confirmation email.",
       "A clear request for the agent to pay the extra charge amount to OMH.",
       "A payment deadline.",
       "Send the recovery request email to the appropriate contact at the agent.",
       "Log the date of the email and the content in the booking system."
      ]
     },
     {
      "t": "h",
      "text": "Step 6 – Follow Up Until Resolution"
     },
     {
      "t": "para",
      "text": "After sending the recovery request, monitor the response and follow up as needed:"
     },
     {
      "t": "table",
      "head": [
       "Situation",
       "VNOP Action"
      ],
      "rows": [
       [
        "No response from agent after initial email",
        "Send a follow-up email to the agent. Continue following up at regular intervals until a response is received."
       ],
       [
        "Agent disputes or denies the charge",
        "Provide additional evidence (voucher, invoice, mapping error confirmation email). Escalate to supervisor if agent continues to deny."
       ],
       [
        "Agent confirms payment",
        "Follow up continuously until the actual payment is received in OMH's account. Do not close the case until payment is confirmed."
       ],
       [
        "Payment received",
        "Confirm receipt. Update the booking record in ELLIS. Close the case. ✔ Done."
       ]
      ]
     },
     {
      "t": "callout",
      "v": "note",
      "title": "Follow-Up Rule",
      "lines": [
       "Never close a recovery case as 'pending' without scheduling a follow-up.",
       "Set a follow-up reminder for every open case — if no response within a reasonable period, send another email.",
       "Do not stop following up until one of two outcomes: payment is received, or the case is formally escalated and closed by the supervisor."
      ]
     },
     {
      "t": "h",
      "text": "Notes"
     },
     {
      "t": "callout",
      "v": "note",
      "title": "",
      "lines": [
       "This SOP applies after the initial mapping error has been identified and handled per SOP-010 (How to Handle Wrong Mapping Booking).",
       "Always check whether an extra charge exists before proceeding — if no extra charge, close the case once the mapping fix is confirmed.",

      ]
     }
    ]

   "body": {
    "en": [
     {
      "t": "h",
      "text": "Scope"
     },
     {
      "t": "para",
      "text": "This procedure applies to all bookings that have been confirmed as unpaid or underpaid by the agent, following the invoice reconciliation process described in SOP-014. It covers portal-based disputes (Agoda, Ctrip, Qunar) and email-based disputes (all other agents)."

     {
      "t": "h",
      "text": "Responsibilities"
     },
     {
      "t": "kv",
      "title": "",
      "rows": [

        "Identify unpaid bookings, prepare evidence, submit disputes via the correct channel, monitor outcomes, follow up, and close cases."

       [
        "IT / SCM Team",
        "Investigate when an agent's rejection reason suggests a system or configuration error on OMH's side."

       [
        "Finance / Related Team",
        "Process Loss Report updates and record received payments."
       ],
       [
        "Agent (AGT)",
        "Review the dispute, respond with a decision, and process payment if the dispute is upheld."

      "t": "h",
      "text": "4. Key Information — Dispute Method by Agent Type"

     {
      "t": "table",
      "head": [
       "Agent Type",
       "Examples",
       "Dispute Method",
       "Result Check"
      ],
      "rows": [

        "Submit dispute directly on the agent's portal",
        "Check portal regularly — results are updated on the portal"

       [
        "Agent WITHOUT Portal",
        "Other agents (no portal)",
        "Send dispute email to the agent's PIC",
        "Monitor email inbox for agent's response"
       ]
      ]
     },
     {
      "t": "callout",
      "v": "info",
      "title": "⏳  Important — Response Time Varies by Agent",
      "lines": [

      "t": "h",
      "text": "5. Procedure"
     },
     {
      "t": "h",
      "text": "Step 1 – Confirm the Unpaid Booking"

     {
      "t": "list",
      "ordered": false,
      "items": [

      "t": "h",
      "text": "Step 2 – Prepare Evidence"

      "t": "para",
      "text": "Strong evidence significantly increases the success rate of the dispute. Prepare the following documents before submitting:"

      "t": "table",
      "head": [
       "#",
       "Evidence / Document",
       "Purpose"

      "rows": [

       [
        "2",
        "Hotel Invoice / Payment Receipt",

  <script>
/* ============================================================
   VNOP SOP Hub — app logic (vanilla JS, no build step)
   ============================================================ */
// Booted by assets/auth.js AFTER the SOP data is placed on window.
window.bootSOPApp = function () {
  "use strict";
  if (window.__sopBooted) return;   // guard against double-boot
  window.__sopBooted = true;

  var LANGS = ["vi", "en"];
  var state = {
    lang: document.documentElement.getAttribute("lang") || "vi",
    cat: "all",
    query: ""
  };
  if (LANGS.indexOf(state.lang) === -1) state.lang = "vi";

  var SOPS = window.SOP_DATA || [];
  var CATS = window.SOP_CATEGORIES || [];
  var I18N = window.I18N || {};
  var GLOSSARY = window.SOP_GLOSSARY || [];
  var TREES = window.SOP_TREES || {};

  // ---- element refs ----
  var $ = function (sel) { return document.querySelector(sel); };
  var listView   = $("#listView");
  var detailView = $("#detailView");
  var cardGrid   = $("#cardGrid");
  var filters    = $("#filters");
  var searchInput= $("#searchInput");
  var searchClear= $("#searchClear");
  var resultCount= $("#resultCount");
  var emptyState = $("#emptyState");
  var langSelect = $("#langSelect");
  var toastEl    = $("#toast");

  // ---- helpers ----
  function t(key) {
    var dict = I18N[state.lang] || I18N.en;
    return (dict && dict[key] != null) ? dict[key] : ((I18N.en && I18N.en[key]) || key);
  }
  function tr(obj) { // translate a {vi,en} object with fallback
    if (!obj) return "";
    return obj[state.lang] || obj.en || obj.vi || "";
  }
  function bodyOf(s) { // blocks array for the active language (en fallback)
    var b = s.body;
    if (Array.isArray(b)) return b;            // legacy shape
    if (!b) return [];
    return b[state.lang] || b.en || b.vi || [];
  }
  function purposeOf(s) {
    return typeof s.purpose === "string" ? s.purpose : tr(s.purpose);
  }
  function catLabel(id) {
    var c = CATS.find(function (x) { return x.id === id; });
    return c ? tr(c.label) : id;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  // ---- toast ----
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    requestAnimationFrame(function () { toastEl.classList.add("show"); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
      setTimeout(function () { toastEl.hidden = true; }, 250);
    }, 1800);
  }

  // ---- favorites & recently viewed (localStorage) ----
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function getFavs() { return lsGet("sop-fav"); }
  function isFav(id) { return getFavs().indexOf(id) !== -1; }
  function toggleFav(id) {
    var f = getFavs(), i = f.indexOf(id);
    if (i === -1) f.push(id); else f.splice(i, 1);
    lsSet("sop-fav", f);
    return i === -1;
  }
  function pushRecent(id) {
    var r = lsGet("sop-recent").filter(function (x) { return x !== id; });
    r.unshift(id);
    lsSet("sop-recent", r.slice(0, 8));
  }
  function getRecent() { return lsGet("sop-recent"); }

  // (theme toggle is wired globally in assets/auth.js so it works on the gate too)

  // ---- search index ----
  function indexText(s) {
    var parts = [s.id];
    LANGS.forEach(function (l) {
      if (s.title && s.title[l]) parts.push(s.title[l]);
      if (s.summary && s.summary[l]) parts.push(s.summary[l]);
      if (s.purpose && s.purpose[l]) parts.push(s.purpose[l]);
      var blk = s.body && (Array.isArray(s.body) ? (l === "en" ? s.body : null) : s.body[l]);
      if (blk) blk.forEach(function (b) { parts.push(flattenBlock(b)); });
    });
    if (typeof s.purpose === "string") parts.push(s.purpose);
    if (s.tags) parts.push(s.tags.join(" "));
    if (s.applicable) parts.push(s.applicable);
    return parts.join("  ").toLowerCase();
  }
  function flattenBlock(b) {
    var out = [];
    if (b.text) out.push(b.text);
    if (b.title) out.push(b.title);
    if (b.lines) out.push(b.lines.join(" "));
    if (b.items) out.push(b.items.join(" "));
    if (b.head) out.push(b.head.join(" "));
    if (b.rows) b.rows.forEach(function (r) { out.push(r.join(" ")); });
    return out.join(" ");
  }
  SOPS.forEach(function (s) { s._index = indexText(s); });

  function highlight(text, q) {
    if (!q) return esc(text);
    var safe = esc(text);
    var needle = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    try {
      return safe.replace(new RegExp("(" + needle + ")", "ig"), "<mark>$1</mark>");
    } catch (e) { return safe; }
  }

  // ---- filtering ----
  function filtered() {
    var q = state.query.trim().toLowerCase();
    var favs = state.cat === "fav" ? getFavs() : null;
    return SOPS.filter(function (s) {
      if (state.cat === "fav") { if (favs.indexOf(s.id) === -1) return false; }
      else if (state.cat !== "all" && s.cat !== state.cat) return false;
      if (q && s._index.indexOf(q) === -1) return false;
      return true;
    });
  }

  // ---- render: filters ----
  function renderFilters() {
    filters.innerHTML = "";
    var defs = [{ id: "all", label: t("allCategories") }].concat(
      CATS.map(function (c) { return { id: c.id, label: tr(c.label) }; })
    );
    if (getFavs().length) defs.push({ id: "fav", label: "★ " + t("favorites") });
    defs.forEach(function (d) {
      var count = d.id === "all" ? SOPS.length
        : d.id === "fav" ? getFavs().length
        : SOPS.filter(function (s) { return s.cat === d.id; }).length;
      var btn = el("button", "chip");
      btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", state.cat === d.id ? "true" : "false");
      var isCat = d.id !== "all" && d.id !== "fav";
      if (isCat) btn.style.setProperty("--dot", "var(--cat-" + d.id + ")");
      btn.innerHTML = (isCat ? '<span class="dot"></span>' : "") +
        esc(d.label) + ' <span class="chip-count">' + count + "</span>";
      btn.addEventListener("click", function () {
        state.cat = d.id;
        renderFilters();
        renderList();
      });
      filters.appendChild(btn);
    });
  }

  // ---- render: card list ----
  function renderRecentStrip() {
    var strip = $("#recentStrip");
    if (!strip) return;
    var ids = getRecent().filter(function (id) { return SOPS.some(function (s) { return s.id === id; }); });
    var show = ids.length && state.cat === "all" && !state.query.trim();
    if (!show) { strip.hidden = true; strip.innerHTML = ""; return; }
    strip.hidden = false;
    strip.innerHTML = '<span class="recent-label">' + esc(t("recent")) + "</span>" +
      ids.slice(0, 6).map(function (id) {
        var s = SOPS.find(function (x) { return x.id === id; });
        return '<button class="recent-chip" type="button" data-id="' + id + '">' +
          esc(id) + ' · ' + esc(tr(s.title)) + "</button>";
      }).join("");
    strip.querySelectorAll(".recent-chip").forEach(function (b) {
      b.addEventListener("click", function () { go(b.getAttribute("data-id")); });
    });
  }

  function sopRow(s, q) {
    var row = el("div", "sop-row");
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.style.setProperty("--cat", "var(--cat-" + s.cat + ")");
    row.setAttribute("aria-label", s.id + " " + tr(s.title));
    var fav = isFav(s.id);
    row.innerHTML =
      '<span class="sop-row-id">' + esc(s.id) + "</span>" +
      '<span class="sop-row-main">' +
        '<span class="sop-row-title">' + highlight(tr(s.title), q) + "</span>" +
        '<span class="sop-row-sum">' + highlight(tr(s.summary), q) + "</span>" +
        '<span class="sop-row-tags">' + (s.tags || []).slice(0, 4).map(function (tg) {
          return '<span class="tag">' + esc(tg) + "</span>"; }).join("") + "</span>" +
      "</span>" +
      '<button class="fav-star' + (fav ? " on" : "") + '" type="button" aria-pressed="' + fav +
        '" aria-label="' + esc(t(fav ? "removeFav" : "addFav")) + '">' + (fav ? "★" : "☆") + "</button>" +
      '<span class="sop-row-go" aria-hidden="true">›</span>';
    row.addEventListener("click", function () { go(s.id); });
    row.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(s.id); } });
    row.querySelector(".fav-star").addEventListener("click", function (e) {
      e.stopPropagation(); toggleFav(s.id); renderFilters(); renderList(); });
    return row;
  }

  function renderList() {
    if (state.cat === "fav" && !getFavs().length) state.cat = "all";
    var rows = filtered();
    var q = state.query.trim();
    renderRecentStrip();
    cardGrid.innerHTML = "";
    if (!rows.length) { emptyState.hidden = false; resultCount.textContent = ""; return; }
    emptyState.hidden = true;
    resultCount.textContent = rows.length + " " + (rows.length === 1 ? t("result") : t("results"));

    var grouped = (state.cat === "all" && !q);
    if (grouped) {
      CATS.forEach(function (c) {
        var items = rows.filter(function (s) { return s.cat === c.id; });
        if (!items.length) return;
        var sec = el("section", "cat-section");
        sec.style.setProperty("--cat", "var(--cat-" + c.id + ")");
        var head = el("div", "cat-head");
        head.innerHTML = '<span class="cat-dot"></span><h2 class="cat-name">' + esc(tr(c.label)) +
          '</h2><span class="cat-count">' + items.length + "</span>";
        sec.appendChild(head);
        var list = el("div", "sop-rows");
        items.forEach(function (s) { list.appendChild(sopRow(s, q)); });
        sec.appendChild(list);
        cardGrid.appendChild(sec);
      });
    } else {
      var list2 = el("div", "sop-rows");
      rows.forEach(function (s) { list2.appendChild(sopRow(s, q)); });
      cardGrid.appendChild(list2);
    }
  }
  // ---- render: block ----
  function renderBlock(b, idx) {
    switch (b.t) {
      case "h":
        return '<h3 class="sec-title" id="' + slug(b.text) + '">' + esc(b.text) + "</h3>";
      case "para":
        return "<p>" + esc(b.text) + "</p>";
      case "list":
        var tag = b.ordered ? "ol" : "ul";
        return "<" + tag + ">" + b.items.map(function (i) {
          return "<li>" + esc(i) + "</li>";
        }).join("") + "</" + tag + ">";
      case "table":
        return '<div class="tbl-wrap"><table><thead><tr>' +
          b.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") +
          "</tr></thead><tbody>" +
          b.rows.map(function (r) {
            return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>";
          }).join("") +
          "</tbody></table></div>";
      case "callout":
        var icon = { info: "ℹ️", warn: "⚠️", critical: "⛔", note: "📌", tip: "💡" }[b.v] || "ℹ️";
        return '<div class="callout ' + esc(b.v) + '">' +
          (b.title ? '<p class="callout-title">' + icon + " " + esc(b.title) + "</p>" : "") +
          (b.lines || []).map(function (l) { return "<p>" + esc(l) + "</p>"; }).join("") +
          "</div>";
      case "kv":
        return '<div class="kv">' +
          (b.title ? '<p class="kv-title">' + esc(b.title) + "</p>" : "") +
          b.rows.map(function (r) {
            return '<div class="kv-row"><span class="kv-k">' + esc(r[0]) +
                   '</span><span class="kv-v">' + esc(r[1]) + "</span></div>";
          }).join("") + "</div>";
      case "checklist":
        return '<div class="checklist-run" data-blk="' + idx + '">' +
          '<div class="chk-progress" data-blk="' + idx + '"></div>' +
          '<ul class="checklist">' +
          b.items.map(function (it, ii) {
            return '<li class="chk-item"><label><input type="checkbox" class="chk-box" data-blk="' +
              idx + '" data-i="' + ii + '" /><span>' + esc(it) + "</span></label></li>";
          }).join("") + "</ul></div>";
      default:
        return "";
    }
  }
  function slug(s) {
    return "sec-" + String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  // ---- render: detail ----
  function mpill(k, v) {
    return '<span class="mpill"><span class="mpill-k">' + esc(k) +
           '</span><span class="mpill-v">' + esc(v) + "</span></span>";
  }
  function isStepHeading(txt) {
    return /^(step|bước|phase|case|giai đoạn)\b/i.test(String(txt).trim());
  }
  function groupSections(blocks) {
    var out = [], cur = { heading: null, blocks: [] };
    blocks.forEach(function (b) {
      if (b.t === "h") { if (cur.heading != null || cur.blocks.length) out.push(cur); cur = { heading: b.text, blocks: [] }; }
      else cur.blocks.push(b);
    });
    if (cur.heading != null || cur.blocks.length) out.push(cur);
    return out;
  }
  function renderSections(blocks) {
    var sections = groupSections(blocks), html = "", inTL = false, n = 0;
    function closeTL() { if (inTL) { html += "</div>"; inTL = false; } }
    sections.forEach(function (sec) {
      if (sec.heading == null) { closeTL(); html += sec.blocks.map(renderBlock).join(""); return; }
      if (isStepHeading(sec.heading)) {
        if (!inTL) { html += '<div class="timeline">'; inTL = true; }
        n++;
        html += '<div class="tl-item"><div class="tl-node">' + n + "</div>" +
          '<div class="tl-card"><h4 class="tl-title" id="' + slug(sec.heading) + '">' + esc(sec.heading) + "</h4>" +
          sec.blocks.map(renderBlock).join("") + "</div></div>";
      } else {
        closeTL();
        html += '<h3 class="sec-h" id="' + slug(sec.heading) + '">' + esc(sec.heading) + "</h3>" +
          sec.blocks.map(renderBlock).join("");
      }
    });
    closeTL();
    return html;
  }

  function renderDetail(s) {
    var blocks = bodyOf(s);
    var headings = blocks.filter(function (b) { return b.t === "h"; });
    var pills = [];
    pills.push(mpill(t("version"), s.version));
    if (s.effective) pills.push(mpill(t("effective"), s.effective));
    if (s.revised)   pills.push(mpill(t("revised"), s.revised));
    if (s.by)        pills.push(mpill(t("preparedBy"), s.by));
    if (s.applicable) pills.push(mpill(t("appliesTo"), s.applicable));
    if (s.related)    pills.push(mpill(t("relatedSop"), s.related));

    var isFallback = !Array.isArray(s.body) && s.body && !s.body[state.lang] && state.lang !== "en";
    var untranslatedNote = isFallback ? '<div class="untranslated-flag">' + esc(t("untranslated")) + "</div>" : "";

    detailView.innerHTML =
      '<button class="back-btn" id="backBtn" type="button">← ' + esc(t("backToList")) + "</button>" +
      '<div class="detail-hero" style="--cat:var(--cat-' + s.cat + ')">' +
        '<div class="dh-top">' +
          '<span class="dh-id">' + esc(s.id) + "</span>" +
          '<span class="dh-cat">' + esc(catLabel(s.cat)) + "</span>" +
          '<button class="fav-star dh-fav' + (isFav(s.id) ? " on" : "") + '" id="favBtn" type="button" aria-pressed="' +
            isFav(s.id) + '" aria-label="' + esc(t(isFav(s.id) ? "removeFav" : "addFav")) + '">' + (isFav(s.id) ? "★" : "☆") + "</button>" +
        "</div>" +
        '<h1 class="dh-title">' + esc(tr(s.title)) + "</h1>" +
        '<p class="dh-purpose">' + esc(purposeOf(s)) + "</p>" +
        '<div class="dh-pills">' + pills.join("") + "</div>" +
      "</div>" +
      '<div class="detail-actions">' +
        (TREES[s.id] ? '<button class="btn btn-accent" id="guidedBtn" type="button">🧭 ' + esc(t("guidedMode")) + "</button>" : "") +
        '<button class="btn" id="printBtn" type="button">🖨 ' + esc(t("print")) + "</button>" +
        '<button class="btn" id="copyBtn" type="button">🔗 ' + esc(t("copyLink")) + "</button>" +
      "</div>" +
      '<div id="treePanel" class="tree-panel" aria-live="polite" hidden></div>' +
      untranslatedNote +
      '<div class="detail-body" style="--cat:var(--cat-' + s.cat + ')">' +
        (headings.length > 2 ? buildQuickNav(headings) : "") +
        '<div class="content">' + renderSections(blocks) + "</div>" +
      "</div>";

    detailView.querySelector("#backBtn").addEventListener("click", function () { go(""); });
    detailView.querySelector("#printBtn").addEventListener("click", function () { window.print(); });
    detailView.querySelector("#copyBtn").addEventListener("click", function () {
      var url = location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast(t("linkCopied")); }, function () { toast(url); });
      } else { toast(url); }
    });
    var favBtn = detailView.querySelector("#favBtn");
    if (favBtn) favBtn.addEventListener("click", function () {
      var on = toggleFav(s.id);
      favBtn.classList.toggle("on", on);
      favBtn.textContent = on ? "★" : "☆";
      favBtn.setAttribute("aria-pressed", on);
      favBtn.setAttribute("aria-label", t(on ? "removeFav" : "addFav"));
      renderFilters();
    });
    var guided = detailView.querySelector("#guidedBtn");
    if (guided) {
      guided.addEventListener("click", function () {
        var panel = detailView.querySelector("#treePanel");
        if (!panel.hidden) { panel.hidden = true; return; }
        panel.hidden = false;
        renderTree(s.id, TREES[s.id].start, []);
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
    decorateTerms(detailView.querySelector(".content"));
    hydrateChecklists(detailView.querySelector(".content"), s.id);
    wireQuickNav();
  }
  // ---- decision tree engine ----
  function renderTree(sopId, nodeId, history) {
    var panel = detailView.querySelector("#treePanel");
    if (!panel) return;
    var tree = TREES[sopId];
    var node = tree.nodes[nodeId];
    var crumbs = '<div class="tree-bar">' +
      '<span class="tree-step">' + (history.length + 1) + "</span>" +
      '<button class="tree-link" id="treeRestart" type="button">↻ ' + esc(t("restart")) + "</button>" +
      (history.length ? '<button class="tree-link" id="treeBack" type="button">← ' + esc(t("back")) + "</button>" : "") +
      "</div>";

    var html = crumbs +
      '<div class="tree-q">' + esc(tr(node.q)) + "</div>" +
      '<div class="tree-options">' +
      node.options.map(function (opt, i) {
        return '<button class="tree-opt" type="button" data-i="' + i + '">' + esc(tr(opt.label)) + "</button>";
      }).join("") +
      "</div>";
    panel.innerHTML = html;

    panel.querySelector("#treeRestart").addEventListener("click", function () {
      renderTree(sopId, tree.start, []);
    });
    var back = panel.querySelector("#treeBack");
    if (back) back.addEventListener("click", function () {
      var prev = history.slice(0, -1);
      var prevNode = history.length ? history[history.length - 1] : tree.start;
      renderTree(sopId, prevNode, prev);
    });
    panel.querySelectorAll(".tree-opt").forEach(function (b) {
      b.addEventListener("click", function () {
        var opt = node.options[+b.getAttribute("data-i")];
        if (opt.goto) {
          renderTree(sopId, opt.goto, history.concat([nodeId]));
        } else if (opt.outcome !== undefined) {
          showOutcome(sopId, tr(opt.label), tr(opt.outcome), history.concat([nodeId]));
        }
      });
    });
  }
  function showOutcome(sopId, choice, text, history) {
    var panel = detailView.querySelector("#treePanel");
    var tree = TREES[sopId];
    panel.innerHTML =
      '<div class="tree-bar">' +
        '<button class="tree-link" id="treeRestart" type="button">↻ ' + esc(t("restart")) + "</button>" +
        '<button class="tree-link" id="treeBack" type="button">← ' + esc(t("back")) + "</button>" +
      "</div>" +
      '<div class="tree-chosen">› ' + esc(choice) + "</div>" +
      '<div class="tree-outcome"><span class="tree-outcome-tag">✅ ' + esc(t("outcomeLabel")) + "</span>" +
        "<p>" + esc(text) + "</p></div>";
    panel.querySelector("#treeRestart").addEventListener("click", function () { renderTree(sopId, tree.start, []); });
    panel.querySelector("#treeBack").addEventListener("click", function () {
      var last = history[history.length - 1];
      renderTree(sopId, last, history.slice(0, -1));
    });
  }

  // ---- interactive checklists (progress saved per SOP) ----
  function hydrateChecklists(root, sopId) {
    if (!root) return;
    root.querySelectorAll(".checklist-run").forEach(function (wrap) {
      var blk = wrap.getAttribute("data-blk");
      var boxes = wrap.querySelectorAll(".chk-box");
      var prog = wrap.querySelector(".chk-progress");
      function key(i) { return "sop-chk:" + sopId + ":" + blk + ":" + i; }
      function update() {
        var done = 0;
        boxes.forEach(function (b) { if (b.checked) done++; });
        prog.textContent = done + " / " + boxes.length;
        prog.classList.toggle("complete", done === boxes.length && boxes.length > 0);
      }
      boxes.forEach(function (b, i) {
        try { b.checked = localStorage.getItem(key(i)) === "1"; } catch (e) {}
        b.closest(".chk-item").classList.toggle("done", b.checked);
        b.addEventListener("change", function () {
          try { localStorage.setItem(key(i), b.checked ? "1" : "0"); } catch (e) {}
          b.closest(".chk-item").classList.toggle("done", b.checked);
          update();
        });
      });
      update();
    });
  }

  // ---- glossary term tooltips inside SOP content ----
  function decorateTerms(root) {
    if (!root || !GLOSSARY.length) return;
    var map = {};
    GLOSSARY.forEach(function (g) {
      if (/^[A-Za-z0-9]+$/.test(g.term)) map[g.term] = g; // acronym-style tokens only
    });
    var tokens = Object.keys(map);
    if (!tokens.length) return;
    var re = new RegExp("\\b(" + tokens.join("|") + ")\\b", "g");
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = walker.nextNode())) {
      if (n.parentNode && n.parentNode.closest(".gterm,.tree-panel,h3")) continue;
      if (re.test(n.nodeValue)) { re.lastIndex = 0; nodes.push(n); }
    }
    nodes.forEach(function (node) {
      var frag = document.createDocumentFragment();
      var last = 0, m, s = node.nodeValue;
      re.lastIndex = 0;
      while ((m = re.exec(s))) {
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var g = map[m[1]];
        var ab = document.createElement("span");
        ab.className = "gterm";
        ab.setAttribute("role", "button");
        ab.setAttribute("tabindex", "0");
        ab.setAttribute("data-full", tr(g.full));
        ab.setAttribute("data-def", tr(g.def));
        ab.setAttribute("aria-label", m[1] + ": " + tr(g.full));
        ab.title = tr(g.full) + " — " + tr(g.def);
        ab.textContent = m[1];
        frag.appendChild(ab);
        last = m.index + m[1].length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  // ---- glossary modal ----
  var glossaryOpener = null;
  function openGlossary() {
    var modal = $("#glossaryModal");
    glossaryOpener = document.activeElement;
    modal.hidden = false;
    renderGlossary("");
    var input = $("#glossaryInput");
    input.value = "";
    setTimeout(function () { input.focus(); }, 30);
  }
  function closeGlossary() {
    $("#glossaryModal").hidden = true;
    if (glossaryOpener && glossaryOpener.focus) glossaryOpener.focus();
  }
  function renderGlossary(q) {
    var list = $("#glossaryList");
    q = (q || "").trim().toLowerCase();
    var rows = GLOSSARY.filter(function (g) {
      if (!q) return true;
      return (g.term + " " + tr(g.full) + " " + tr(g.def)).toLowerCase().indexOf(q) !== -1;
    });
    if (!rows.length) { list.innerHTML = '<p class="glossary-empty">' + esc(t("glossaryEmpty")) + "</p>"; return; }
    list.innerHTML = rows.map(function (g) {
      return '<div class="gitem"><div class="gitem-term">' + esc(g.term) +
        ' <span class="gitem-full">' + esc(tr(g.full)) + "</span></div>" +
        '<p class="gitem-def">' + esc(tr(g.def)) + "</p></div>";
    }).join("");
  }

  // ---- term popover (tap / keyboard accessible) ----
  function wireTermPopover() {
    var pop = $("#termPop");
    if (!pop) return;
    function hide() { pop.hidden = true; pop._for = null; }
    function show(el) {
      pop.innerHTML = "<strong>" + esc(el.getAttribute("data-full")) + "</strong>" +
        "<span>" + esc(el.getAttribute("data-def")) + "</span>";
      pop.hidden = false;
      var r = el.getBoundingClientRect();
      var maxLeft = window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 12;
      pop.style.top = (r.bottom + window.scrollY + 6) + "px";
      pop.style.left = Math.max(window.scrollX + 8, Math.min(r.left + window.scrollX, maxLeft)) + "px";
      pop._for = el;
    }
    document.addEventListener("click", function (e) {
      var term = e.target.closest && e.target.closest(".gterm");
      if (term) { e.stopPropagation(); if (!pop.hidden && pop._for === term) hide(); else show(term); return; }
      if (!pop.hidden && !(e.target.closest && e.target.closest("#termPop"))) hide();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") hide();
      var el = document.activeElement;
      if ((e.key === "Enter" || e.key === " ") && el && el.classList && el.classList.contains("gterm")) {
        e.preventDefault(); if (!pop.hidden && pop._for === el) hide(); else show(el);
      }
    });
    window.addEventListener("scroll", function () { if (!pop.hidden) hide(); }, true);
  }
  function metaItem(k, v) {
    return '<div class="meta-item"><span class="meta-k">' + esc(k) +
           '</span><span class="meta-v">' + esc(v) + "</span></div>";
  }
  function buildQuickNav(headings) {
    return '<nav class="quicknav" aria-label="' + esc(t("quickNav")) + '">' +
      "<h3>" + esc(t("quickNav")) + "</h3>" +
      headings.map(function (h) {
        return '<a href="#' + slug(h.text) + '">' + esc(h.text) + "</a>";
      }).join("") + "</nav>";
  }
  function wireQuickNav() {
    var links = detailView.querySelectorAll(".quicknav a");
    if (!links.length) return;
    links.forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var id = a.getAttribute("href").slice(1);
        var target = document.getElementById(id);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  // ---- routing ----
  function go(id) {
    if (id) location.hash = "/sop/" + id;
    else location.hash = "";
    route();
  }
  function route() {
    var hash = location.hash.replace(/^#/, "");
    var m = hash.match(/^\/sop\/(SOP-\d+)/i);
    if (m) {
      var s = SOPS.find(function (x) { return x.id.toLowerCase() === m[1].toLowerCase(); });
      if (s) {
        pushRecent(s.id);
        listView.hidden = true;
        detailView.hidden = false;
        renderDetail(s);
        window.scrollTo(0, 0);
        return;
      }
    }
    detailView.hidden = true;
    listView.hidden = false;
    renderList();   // refresh stars / recently-viewed when returning to the list
  }
  window.addEventListener("hashchange", route);

  // ---- language ----
  function applyI18n() {
    document.documentElement.setAttribute("lang", state.lang);
    document.querySelectorAll("[data-i18n]").forEach(function (node) {
      var key = node.getAttribute("data-i18n");
      var attr = node.getAttribute("data-i18n-attr");
      if (attr) node.setAttribute(attr, t(key));
      else node.textContent = t(key);
    });
    document.title = t("appTitle");
  }
  function setLang(lang) {
    if (LANGS.indexOf(lang) === -1) lang = "vi";
    state.lang = lang;
    try { localStorage.setItem("sop-lang", lang); } catch (e) {}
    applyI18n();
    renderFilters();
    // Re-render both views so neither holds stale-language content.
    renderList();
    if (!detailView.hidden) route();
  }
  function buildLangSelect() {
    langSelect.innerHTML = LANGS.map(function (l) {
      var name = (I18N[l] && I18N[l]._name) || l;
      return '<option value="' + l + '"' + (l === state.lang ? " selected" : "") + ">" +
             esc(name) + "</option>";
    }).join("");
    langSelect.addEventListener("change", function () { setLang(langSelect.value); });
  }

  // ---- search wiring ----
  var debounce;
  searchInput.addEventListener("input", function () {
    state.query = searchInput.value;
    searchClear.hidden = !state.query;
    clearTimeout(debounce);
    debounce = setTimeout(renderList, 120);
  });
  searchClear.addEventListener("click", function () {
    state.query = "";
    searchInput.value = "";
    searchClear.hidden = true;
    searchInput.focus();
    renderList();
  });
  $("#brandHome").addEventListener("click", function () {
    state.query = ""; searchInput.value = ""; searchClear.hidden = true;
    state.cat = "all";
    go("");
    renderFilters(); renderList();
  });
  // "/" focuses search
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== searchInput && detailView.hidden) {
      e.preventDefault(); searchInput.focus();
    }
    if (e.key === "Escape" && document.activeElement === searchInput && state.query) {
      searchClear.click();
    }
  });

  // ---- init ----
  // glossary modal wiring
  wireTermPopover();
  if (GLOSSARY.length) {
    $("#glossaryBtn").addEventListener("click", openGlossary);
    $("#glossaryInput").addEventListener("input", function () { renderGlossary(this.value); });
    var gmodal = $("#glossaryModal");
    gmodal.addEventListener("click", function (e) {
      if (e.target.getAttribute("data-close")) closeGlossary();
    });
    document.addEventListener("keydown", function (e) {
      if ($("#glossaryModal").hidden) return;
      if (e.key === "Escape") { closeGlossary(); return; }
      if (e.key === "Tab") {                       // focus trap
        var f = gmodal.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
  } else {
    var gb = $("#glossaryBtn"); if (gb) gb.style.display = "none";
  }

  buildLangSelect();
  applyI18n();
  renderFilters();
  renderList();
  route();
};

</script>
  <script>
/* ============================================================
   VNOP SOP Hub — cổng đăng nhập đơn giản (KHÔNG mã hóa nội dung)
   ------------------------------------------------------------
   Nội dung SOP nằm ở data/sops.js dưới dạng văn bản thường (dễ sửa).
   Cổng này chỉ "che" trang trước người xem tình cờ: khi nhập đúng
   ID + Mật khẩu, mã băm SHA-256 sẽ khớp với window.SOP_AUTH.hash và
   trang được hiển thị.
   ⚠ LƯU Ý BẢO MẬT: đây KHÔNG phải bảo mật thật. Bất kỳ ai mở mã nguồn
   trang (hoặc file data/sops.js) đều đọc được nội dung. Đừng đưa mật
   khẩu/thông tin đăng nhập THẬT của hệ thống vào tài liệu này.
   ============================================================ */
(function () {
  "use strict";

  var LANGS = ["vi", "en"];
  var I18N = window.I18N || {};
  var SS_KEY = "sop-pass";   // sessionStorage: nhớ đã mở khóa trong phiên tab

  function lang() {
    var l = document.documentElement.getAttribute("lang") || "vi";
    return LANGS.indexOf(l) === -1 ? "vi" : l;
  }
  function t(key) {
    var d = I18N[lang()] || I18N.en;
    return (d && d[key] != null) ? d[key] : ((I18N.en && I18N.en[key]) || key);
  }
  function $(s) { return document.querySelector(s); }

  // ---- SHA-256 -> hex ----
  async function sha256hex(str) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    var arr = Array.from(new Uint8Array(buf));
    return arr.map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  // ---- đặt dữ liệu lên window và khởi động app ----
  function launch() {
    var p = window.SOP_PAYLOAD || {};
    window.SOP_CATEGORIES = p.categories || [];
    window.SOP_GLOSSARY   = p.glossary || [];
    window.SOP_TREES      = p.trees || {};
    window.SOP_DATA       = p.data || [];
    document.body.classList.remove("locked");
    var gate = $("#authGate");
    if (gate) gate.remove();
    if (typeof window.bootSOPApp === "function") window.bootSOPApp();
  }

  // ---- bản địa hóa cổng (app.js lo phần đã mở khóa) ----
  function localizeGate() {
    document.querySelectorAll("#authGate [data-i18n]").forEach(function (n) {
      var attr = n.getAttribute("data-i18n-attr");
      if (attr) n.setAttribute(attr, t(n.getAttribute("data-i18n")));
      else n.textContent = t(n.getAttribute("data-i18n"));
    });
    document.title = t("appTitle");
  }

  // ---- nút đổi giao diện (dùng chung cho cổng và app) ----
  function bindTheme() {
    document.addEventListener("click", function (e) {
      var btn = e.target.closest && e.target.closest(".js-theme-toggle");
      if (!btn) return;
      var cur = document.documentElement.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("sop-theme", next); } catch (e2) {}
    });
  }

  // ---- chọn ngôn ngữ ở cổng ----
  function buildGateLang() {
    var sel = $("#gateLang");
    if (!sel) return;
    sel.innerHTML = LANGS.map(function (l) {
      var name = (I18N[l] && I18N[l]._name) || l;
      return '<option value="' + l + '"' + (l === lang() ? " selected" : "") + ">" + name + "</option>";
    }).join("");
    sel.addEventListener("change", function () {
      var l = LANGS.indexOf(sel.value) === -1 ? "vi" : sel.value;
      document.documentElement.setAttribute("lang", l);
      try { localStorage.setItem("sop-lang", l); } catch (e) {}
      localizeGate();
    });
  }

  function showError(msg) {
    var e = $("#authError");
    e.textContent = msg; e.hidden = false;
  }

  function init() {
    bindTheme();
    buildGateLang();
    localizeGate();

    var form = $("#authForm");
    var idEl = $("#authId");
    var pwEl = $("#authPw");
    var btn = $("#authSubmit");

    var EXPECTED = (window.SOP_AUTH && window.SOP_AUTH.hash) ? window.SOP_AUTH.hash : "";

    if (!window.SOP_PAYLOAD) { showError("Không tìm thấy dữ liệu (data/sops.js)."); return; }
    if (!(window.crypto && window.crypto.subtle)) {
      // Không có Web Crypto (thường do mở bằng file:// ). Mở qua http/https.
      showError(t("cryptoUnsupported")); return;
    }

    function attempt(id, pw, opts) {
      opts = opts || {};
      btn.disabled = true;
      var prev = btn.textContent;
      btn.textContent = t("unlocking");
      var pass = id.trim().toUpperCase() + ":" + pw.trim();
      return sha256hex(pass).then(function (h) {
        if (h === EXPECTED) {
          try { sessionStorage.setItem(SS_KEY, JSON.stringify({ id: id, pw: pw })); } catch (e) {}
          launch();
        } else {
          btn.disabled = false; btn.textContent = prev;
          if (!opts.silent) { showError(t("wrongCreds")); pwEl.value = ""; pwEl.focus(); }
        }
      }).catch(function () {
        btn.disabled = false; btn.textContent = prev;
        if (!opts.silent) showError(t("wrongCreds"));
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      $("#authError").hidden = true;
      attempt(idEl.value, pwEl.value);
    });

    // Tự mở khóa nếu phiên tab này đã đăng nhập.
    try {
      var saved = sessionStorage.getItem(SS_KEY);
      if (saved) {
        var c = JSON.parse(saved);
        attempt(c.id, c.pw, { silent: true });
      } else {
        idEl.focus();
      }
    } catch (e) { idEl.focus(); }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
